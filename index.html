<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Notes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6e7d3"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<title>Little Notes</title>
<style>
/* Little Notes: Izabele's wish notebook for Cozy Town. One file, no libraries. Data: Firebase (REST + live stream). */
:root{--bg:#f6e7d3;--side:#f8ecdc;--paper:#fdf4e8;--ink:#4a3426;--soft:#9b806b;--line:#ead2b4;--acc:#f0a35e;--accs:#fbdcb8;--card:#fffaf3;--red:#e0563b;--tint:#b0581a;color-scheme:light}
:root[data-theme=dark]{--bg:#1d1814;--side:#241e19;--paper:#2b241e;--ink:#f3e6d6;--soft:#b39c86;--line:#463a2f;--acc:#f0a35e;--accs:#4a3523;--card:#332a23;--red:#ff7b61;--tint:#f5b06e;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.35 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}:focus-visible,textarea:focus,#lock input:focus{outline:2px solid var(--acc);outline-offset:2px}:focus:not(:focus-visible){outline:none}.row :focus-visible{outline-offset:-3px}nav .ico{position:relative;top:-1px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
#side{background:var(--side);padding:calc(18px + env(safe-area-inset-top)) 16px 24px calc(16px + env(safe-area-inset-left));position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 18px}.brand img{width:64px}.brand b{font-size:26px;font-weight:700}
.search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--soft)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--ink);font-size:16px;height:44px}
nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:none;text-align:left;font-size:17px}
nav button.on{background:var(--accs);font-weight:600}.sec{margin:14px 12px 4px;font-size:13px;color:var(--soft);border-top:1px solid var(--line);padding-top:14px}
main{min-width:0;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) 16px}
.tools{display:flex;align-items:center;gap:6px;min-height:44px}.sp{flex:1}
.tb{width:44px;height:44px;border:0;border-radius:22px;background:none;display:grid;place-items:center}.tb.add{background:var(--acc);color:#fff}
#back{display:none;border:0;background:none;min-height:44px;padding:0 8px 0 0;color:var(--tint);font-size:17px;font-weight:600;align-items:center;gap:2px}
#q2w{margin:6px 0 10px}
.paper{position:relative;background:var(--paper);border-radius:24px;margin-top:8px;padding:18px 22px 190px;min-height:calc(100vh - 90px);box-shadow:0 1px 0 var(--line)}
.ph{display:flex;align-items:center;gap:12px;min-height:96px;margin-bottom:10px}.ph:after{content:"";width:84px;flex:none}
.ph .pc{width:84px;flex:none;align-self:flex-start}.ph .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}.ph .pb{width:200px;max-width:100%;border-radius:12px}
.ph h1{margin:0;padding:10px 24px;font-size:22px;font-weight:700;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px}
.paper:before,.paper:after{content:"";position:absolute;width:46px;height:46px;pointer-events:none;background:repeating-linear-gradient(-60deg,transparent 0 9px,var(--acc) 9px 14px);opacity:.35;border-radius:50%}
.paper:before{right:14px;top:14px}.paper:after{left:14px;bottom:14px}
.pbig{position:absolute;right:16px;bottom:12px;width:150px;pointer-events:none}
.row{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.sw{position:relative;z-index:1;display:flex;align-items:center;background:var(--paper);transition:transform .2s;touch-action:pan-y}
.tick,.star{width:44px;height:48px;border:0;background:none;display:grid;place-items:center;flex:none}
.tick i{width:26px;height:26px;border:2px solid var(--soft);border-radius:8px;display:grid;place-items:center}
.done .tick i{background:var(--acc);border-color:var(--acc);color:#fff}.tick .ico{width:16px;height:16px;stroke-width:3;opacity:0}.done .tick .ico{opacity:1}
.txt{flex:1;min-width:0;min-height:48px;border:0;background:none;text-align:left;padding:10px 6px;overflow-wrap:anywhere}
.txt small{display:block;font-size:13px;color:var(--soft);margin-top:2px}.done .txt span{opacity:.5;text-decoration:line-through}
.star{color:var(--soft)}.star.on{color:var(--acc)}.star.on .ico{fill:currentColor}
.del{position:absolute;right:0;top:0;bottom:0;width:88px;border:0;background:#cf3f25;color:#fff;font-weight:600}
.empty{color:var(--soft);padding:24px 6px}
#lock{position:fixed;inset:0;z-index:9;background:var(--bg);display:grid;place-items:center;padding:24px}
#lock form{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
#lock img{width:130px}#lock h1{margin:0;font-size:30px}
#lock input,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px}
.pri{min-height:48px;min-width:120px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;padding:0 20px}
#lerr{color:var(--red);min-height:22px;margin:0}
dialog{border:0;border-radius:20px;background:var(--paper);color:var(--ink);width:min(520px,calc(100% - 32px));padding:20px;box-shadow:0 10px 40px #0004}dialog::backdrop{background:#0006}
dialog h2{margin:0 0 12px;font-size:20px}dialog textarea{resize:vertical;min-height:110px}
.bar{display:flex;gap:8px;margin-top:14px;align-items:center}.bar .sp{flex:1}
.bar button{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card)}.bar .pri{border:0;background:var(--acc);color:#fff}.bar .red{color:var(--red)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:10}
@media (max-width:699px){#app{display:block}#side{position:static;height:auto;min-height:100vh;padding-right:calc(16px + env(safe-area-inset-right))}main{display:none}
 .in #side{display:none}.in main{display:block}#back{display:flex}.paper{padding:12px 12px 170px;min-height:calc(100vh - 80px)}.ph .pc{width:56px}.ph:after{width:56px}.ph h1{font-size:19px;padding:8px 14px}.paper:before{display:none}.pbig{width:120px}
 dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
</style></head><body>

<script>
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search);
const DB=(Q.get('db')||'https://cozy-town-264d2-default-rtdb.europe-west1.firebasedatabase.app').replace(/\/$/,''),NP='worlds/'+(Q.get('w')||'cozy-town')+'/board/notes',SV={'.sv':'timestamp'};
const NAMES={all:'All notes',fav:'Favorites',dev:'Developers Board',game:'Gamers Board'};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){return null}};
let H=null,MY={},GN={},view=ls('ln_v')||'dev',q='',es=[],edit=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);   /* same id style as the game */
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3000);}
/* theme: follows the device until the moon is tapped */
function theme(t){if(t)document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();}
theme(ls('ln_t'));
$('moon').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';ls('ln_t',t);theme(t);};
/* 🔑 the secret word never leaves the device: only a code made from it is used as the name of our section */
async function code(w){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('little-notes:'+w.trim().toLowerCase()));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40);}
async function tryCode(h){try{const r=await fetch(`${DB}/wishes/${h}/ok.json`);return r.ok?1:r.status===401||r.status===403?0:-1;}catch(e){return -1}}
$('lf').onsubmit=async e=>{e.preventDefault();const w=$('lw').value;if(!w.trim())return;$('lerr').textContent='Checking...';const h=await code(w),ok=await tryCode(h);
  if(ok===1){ls('ln_k',h);$('lw').value='';open(h);}else $('lerr').textContent=ok===0?'That is not the secret word.':'No connection. Try again.';};
function open(h){H=h;$('lock').hidden=true;$('lerr').textContent='';start();}
/* 📡 live data: Firebase sends every change at once (no reload) */
function put(root,path,data){const ks=path.split('/').filter(Boolean);if(!ks.length)return data;root=root&&typeof root==='object'?root:{};let o=root;
  for(let i=0;i<ks.length-1;i++)o=o[ks[i]]=o[ks[i]]&&typeof o[ks[i]]==='object'?o[ks[i]]:{};const l=ks[ks.length-1];if(data===null)delete o[l];else o[l]=data;return root;}
function listen(path,set){let d=null;const e=new EventSource(`${DB}/${path}.json`);
  e.addEventListener('put',v=>{const m=JSON.parse(v.data);d=put(d,m.path,m.data);set(d);draw();});
  e.addEventListener('patch',v=>{const m=JSON.parse(v.data);for(const k in m.data)d=put(d,m.path.replace(/\/$/,'')+'/'+k,m.data[k]);set(d);draw();});
  e.addEventListener('cancel',()=>{stop();ls('ln_k',null);$('lock').hidden=false;$('lerr').textContent='Please type the secret word again.';});es.push(e);}
function stop(){es.forEach(e=>e.close());es=[];}
function start(){stop();listen(NP,d=>GN=d||{});listen('wishes/'+H,d=>MY=d||{});draw();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&H&&es.some(e=>e.readyState===2))start();});
/* ✍️ every change is one write to several places at once: all of it happens, or none of it */
async function save(u){const body=JSON.stringify(u),now=Date.now(),loc=JSON.parse(body,(k,v)=>v&&v['.sv']?now:v);
  for(const k in loc){if(k.startsWith(NP+'/'))GN=put(GN,k.slice(NP.length),loc[k]);else if(k.startsWith('wishes/'+H+'/'))MY=put(MY,k.slice(('wishes/'+H).length),loc[k]);}draw();
  try{const r=await fetch(`${DB}/.json`,{method:'PATCH',body});if(!r.ok)throw 0;}catch(e){toast('Not saved. Check the connection and try again.');start();}}
const me=k=>'wishes/'+H+'/'+k,stamp=u=>(u[me('stamp')]=SV,u);   /* the stamp proves this notebook made the change to a game idea */
function rows(){const dev=Object.entries(MY.dev||{}).map(([id,n])=>({k:'dev',id,t:String(n&&n.t||''),at:+(n&&n.at)||0,done:!!(n&&n.done),fav:!!(n&&n.fav)}));
  const gm=Object.entries(GN||{}).filter(([,n])=>n&&typeof n==='object').map(([id,n])=>{const f=(MY.g||{})[id]||{};let h=0;for(const k in n.h||{})h+=+n.h[k]||0;
    return{k:'game',id,t:String(n.t||''),n:String(n.n||''),h,at:+n.at||0,done:!!f.done,fav:!!f.fav};});
  let L=view==='dev'?dev:view==='game'?gm:dev.concat(gm);if(view==='fav')L=L.filter(r=>r.fav);
  if(q)L=L.filter(r=>(r.t+' '+(r.n||'')).toLowerCase().includes(q));return L.sort((a,b)=>b.at-a.at||(a.id<b.id?1:-1));}
function draw(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));$('title').textContent=q?'Search results':NAMES[view];
  $('paper').classList.toggle('game',view==='game');$('pb').hidden=view!=='game';if(!H)return;const L=rows(),mix=view==='all'||view==='fav';
  $('list').innerHTML=L.map(r=>{const sub=[mix?NAMES[r.k]:'',r.k==='game'?'♥ '+r.h+' · '+esc(r.n||'A friend'):''].filter(Boolean).join(' · ');
    return`<div class="row${r.done?' done':''}" data-k="${r.k}" data-id="${esc(r.id)}"><div class="sw"><button class="tick" aria-label="Done" aria-pressed="${r.done}"><i><svg class="ico"><use href="#i-ok"/></svg></i></button>
<button class="txt"><span>${r.t?esc(r.t):'<i>(empty)</i>'}</span>${sub?`<small>${sub}</small>`:''}</button><button class="star${r.fav?' on':''}" aria-label="Favorite" aria-pressed="${r.fav}"><svg class="ico"><use href="#i-star"/></svg></button></div><button class="del">Delete</button></div>`;}).join('')
    ||`<p class="empty">${q?'Nothing found.':view==='fav'?'No favorites yet. Tap a star.':'No notes yet. Tap + to add one.'}</p>`;}
const get=(k,id)=>k==='dev'?(MY.dev||{})[id]:GN[id];
function flag(k,id,f){const r=get(k,id);if(!r)return;const on=k==='dev'?!r[f]:!((MY.g||{})[id]||{})[f];save({[me((k==='dev'?'dev/':'g/')+id+'/'+f)]:on||null});}
function del(k,id){const n=get(k,id);if(!n)return;const u={[me('trash/'+id)]:{from:k,note:n,flags:k==='game'?(MY.g||{})[id]||null:null,at:SV}};
  if(k==='dev')u[me('dev/'+id)]=null;else{u[NP+'/'+id]=null;u[me('g/'+id)]=null;stamp(u);}save(u);toast('Moved to Trash.');}
function openEd(k,id){const n=id?get(k,id):null;edit={k,id};$('edh').textContent=id?'Edit note':k==='game'?'New idea for the game':'New note';
  $('edt').maxLength=k==='game'?80:1000;$('edt').value=n?String(n.t||''):'';$('edd').hidden=!id;$('ed').showModal();$('edt').focus();}
$('ed').addEventListener('close',()=>{const v=$('ed').returnValue,{k,id}=edit||{};$('ed').returnValue='';if(!edit)return;edit=null;const t=$('edt').value.replace(/\s+/g,' ').trim().slice(0,k==='game'?80:1000);
  if(v==='del'&&id)return del(k,id);if(v!=='ok'||!t)return;
  if(!id){const n=uid();save(k==='game'?{[NP+'/'+n]:{t,n:'Little Notes',at:SV,p:'notebook'}}:{[me('dev/'+n)]:{t,at:SV}});return;}
  if(!get(k,id)||t===String(get(k,id).t))return;save(k==='game'?stamp({[NP+'/'+id+'/t']:t}):{[me('dev/'+id+'/t')]:t});});
/* 👆 taps on the list; swipe left on a phone or iPad shows Delete (like Apple's own lists) */
let sx=null,moved=false,openRow=null;
function shut(){if(openRow){openRow.style.transform='';openRow=null;}}
$('list').addEventListener('pointerdown',e=>{moved=false;const s=e.target.closest('.sw');if(s&&e.pointerType!=='mouse')sx=[e.clientX,e.clientY,s];});
$('list').addEventListener('pointermove',e=>{if(!sx)return;const dx=e.clientX-sx[0];if(Math.abs(e.clientY-sx[1])>Math.abs(dx)&&!moved){sx=null;return;}
  if(Math.abs(dx)>10){moved=true;sx[2].style.transition='none';sx[2].style.transform=`translateX(${Math.max(-88,Math.min(0,dx+(sx[2]===openRow?-88:0)))}px)`;}});
addEventListener('pointerup',e=>{if(!sx)return;const s=sx[2],dx=e.clientX-sx[0]+(s===openRow?-88:0);sx=null;s.style.transition='';if(!moved)return;
  if(dx<-44){if(openRow&&openRow!==s)shut();s.style.transform='translateX(-88px)';openRow=s;}else{s.style.transform='';if(openRow===s)openRow=null;}});
$('list').addEventListener('click',e=>{const b=e.target.closest('button'),row=e.target.closest('.row');if(!b||!row)return;if(moved){moved=false;return;}
  const{k,id}=row.dataset;if(b.classList.contains('del')){shut();return del(k,id);}if(openRow){shut();return;}
  if(b.classList.contains('tick'))flag(k,id,'done');else if(b.classList.contains('star'))flag(k,id,'fav');else openEd(k,id);});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;ls('ln_v',view);document.body.classList.add('in');shut();draw();scrollTo(0,0);});
$('back').onclick=()=>{document.body.classList.remove('in');scrollTo(0,0);};
$('add').onclick=()=>openEd(view==='game'?'game':'dev',null);
const setQ=v=>{q=v.trim().toLowerCase();$('q').value=$('q2').value=v;draw();};$('q').oninput=e=>setQ(e.target.value);$('q2').oninput=e=>setQ(e.target.value);
$('find').onclick=()=>{if(innerWidth<700){$('q2w').hidden=!$('q2w').hidden;if(!$('q2w').hidden)$('q2').focus();else setQ('');}else $('q').focus();};
(async()=>{draw();const h=ls('ln_k');if(h&&await tryCode(h)!==0)open(h);})();
</script></body></html>
